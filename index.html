<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Kenanganku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-1">
    <!-- Hamburger Button -->
    <div class="hamburger-btn" id="hamburger-btn">☰</div>

    <!-- Sidebar Navigation (Opacity 30%) -->
    <nav id="sidebar" class="sidebar">
        <span class="close-sidebar" id="close-sidebar">&times;</span>
        <ul>
            <li><a href="#" id="menu-gallery">📸 Galeri</a></li>
            <li><a href="#" id="upload-btn">⬆ Upload Foto</a></li>
            <li><a href="#" id="refresh-btn">🎨 Ganti Tema</a></li>
            <li><a href="#" id="menu-game">🎮 Main Game</a></li>
        </ul>
    </nav>

    <!-- Container Utama Galeri -->
    <main id="gallery-section" class="gallery">
        <div id="gallery-container" class="gallery-inner">
            <div class="empty-state">Belum ada foto kenangan. Silakan upload!</div>
        </div>
    </main>

    <!-- Container Utama Game -->
    <main id="game-section" class="hidden">
        <!-- Panel Login -->
        <div id="login-panel" class="game-panel">
            <h2>Siapa yang main? 👀</h2>
            <input type="text" id="player-name" placeholder="Nama kamu / ayang">
            <button id="login-btn">Masuk</button>
        </div>

        <!-- Arena Game -->
        <div id="game-arena" class="hidden">
            <!-- Dropdown Pilihan Game & Level -->
            <div class="game-mode-selector">
                <select id="game-mode-select">
                    <option value="find-photo">🔍 Cari Foto di Layar</option>
                    <option value="guess-photo" disabled>🧩 Tebak Foto (Segera Hadir)</option>
                    <option value="puzzle-photo" disabled>🖼️ Puzzle Foto (Segera Hadir)</option>
                    <option value="memory-game" disabled>🧠 Memory Match (Segera Hadir)</option>
                </select>

                <select id="level-select">
                    <option value="easy">🟢 Easy (5-10 Foto)</option>
                    <option value="normal" selected>🟡 Normal (10-15 Foto)</option>
                    <option value="hard">🟠 Hard (15-20 Foto)</option>
                    <option value="iloveyou">❤️ I Love You (Full Foto!)</option>
                </select>
            </div>

            <div class="game-header">
                <!-- Box Foto Target (Simetris Kiri) -->
                <div class="game-box target-clue">
                    <p>Cari foto ini!</p>
                    <button id="start-game-btn">Mulai / Acak</button>
                    <img id="target-photo" src="" alt="Target">
                </div>

                <!-- Info Pemain, Waktu, & Tombol Leaderboard (Simetris Kanan) -->
                <div class="game-box game-info">
                    <p class="score-text">Pemain: <span id="current-player">-</span> | Waktu: <span id="time-display">0.00</span> dtk</p>
                    <button id="leaderboard-btn">🏆 Leaderboard</button>
                </div>
            </div>
            
            <!-- Tempat foto berserakan -->
            <div id="scatter-area"></div>
        </div>
    </main>

    <!-- Modal Leaderboard -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-leaderboard">&times;</span>
            <h2>🏆 Leaderboard</h2>
            <ul id="leaderboard-list">
                <li>Memuat...</li>
            </ul>
        </div>
    </div>

    <!-- Modal Upload -->
    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Upload Foto Kenangan</h2>
            <input type="file" id="file-input" accept="image/*" multiple>
            <button id="submit-upload">Simpan ke Galeri</button>
            <p id="upload-status"></p>
        </div>
    </div>

    <!-- Modal Lightbox -->
    <div id="lightbox-modal" class="modal hidden">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
